# Per-user Immich → Pixel FTP profiles.
# Copy to users.yaml and fill secrets. Never commit real users.yaml.

users:
  - id: nat
    enabled: true
    immich_api_key: "REPLACE_WITH_IMMICH_API_KEY"
    webhook_token: "REPLACE_WITH_RANDOM_TOKEN"
    # Optional: override global catchup_cron from app.yaml
    catchup_cron: "*/5 * * * *"
    ftp:
      host: 192.168.2.199
      port: 12345
      username: photo
      password: "REPLACE_WITH_FTP_PASSWORD"
      # Must be a folder Google Photos backs up on that Pixel.
      remote_dir: /storage/emulated/0/DCIM/ImmichSync

