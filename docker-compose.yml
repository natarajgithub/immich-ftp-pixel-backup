name: immich-ftp-pixel-backup

services:
  sync:
    build: .
    image: immich-ftp-pixel-backup:local
    container_name: immich-ftp-pixel-backup
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:8080"
    volumes:
      - ${CONFIG_ROOT:-./runtime-config}:/config:ro
      - ${DATA_ROOT:-./runtime-data}:/data
    environment:
      TZ: ${TZ:-America/Toronto}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
